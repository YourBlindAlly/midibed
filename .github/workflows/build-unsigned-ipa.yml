name: Build unsigned iOS ipa

# Unsigned .ipa for sideloading with iLoader (applies Rusty's free Apple ID
# signature at install time). Adapted from the working LyriCue workflow:
# expo prebuild -> xcodebuild archive with signing disabled, on a GitHub macOS
# runner (free for public repos; there is no local Mac).

on:
  push:
    branches: [master]
  workflow_dispatch: {}

env:
  CI: true

permissions:
  contents: write

jobs:
  build:
    # macos-15's Xcode tops out at 26.3, which fails to compile
    # expo-modules-jsi's Swift 6.3 syntax. macos-26 carries newer Xcodes.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4"

      - name: Install JS dependencies
        run: npm ci

      - name: Prebuild native iOS project
        run: npx expo prebuild --platform ios --non-interactive

      - name: Find workspace and scheme
        id: find
        run: |
          workspace=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -n1)
          # Query the main .xcodeproj, not the workspace: the workspace also
          # lists every CocoaPods sub-target's scheme (including our native
          # module), and picking schemes[0] there depends on sort order.
          project=$(find ios -maxdepth 1 -name "*.xcodeproj" | head -n1)
          scheme=$(xcodebuild -list -project "$project" -json | \
            node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8')); console.log(d.project.schemes[0]);")
          echo "workspace=$workspace" >> "$GITHUB_OUTPUT"
          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"
          echo "Found workspace: $workspace, scheme: $scheme"

      - name: Archive (code signing disabled)
        run: |
          xcodebuild archive \
            -workspace "${{ steps.find.outputs.workspace }}" \
            -scheme "${{ steps.find.outputs.scheme }}" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/MidiBed.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned ipa
        run: |
          app_path=$(find build/MidiBed.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -n1)
          mkdir -p Payload
          cp -r "$app_path" Payload/
          zip -r MidiBed-unsigned.ipa Payload
          echo "Built: $(ls -la MidiBed-unsigned.ipa)"

      - uses: actions/upload-artifact@v4
        with:
          name: MidiBed-unsigned-ipa
          path: MidiBed-unsigned.ipa
          retention-days: 30

      # Rolling release with a stable URL, replaced on every push:
      # https://github.com/<owner>/<repo>/releases/download/latest-build/MidiBed-unsigned.ipa
      - name: Publish to the rolling "latest-build" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes --repo "${{ github.repository }}" || true
          git tag -f latest-build
          git push -f origin latest-build
          gh release create latest-build MidiBed-unsigned.ipa \
            --repo "${{ github.repository }}" \
            --title "Latest unsigned build" \
            --notes "Automatically published from commit ${{ github.sha }}. Unsigned - install with iLoader (free Apple ID signing)." \
            --latest
